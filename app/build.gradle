plugins {
    id 'com.android.application'
}

android {
    namespace 'co.katrilocos.app'
    compileSdk 34

    defaultConfig {
        applicationId "co.katrilocos.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'wasm', 'zip', 'whl'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
